# Run the test suite against the oldest and newest supported Python and prov versions.
# The prov version is forced with `uv run --with`, over the one locked in uv.lock.

stages:
  - test
  - build
  - publish

.test:
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON-bookworm
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    key: uv-$PYTHON
    paths:
      - .uv-cache
  script:
    - uv run --python $PYTHON --with "prov==$PROV" pytest -q -p no:cacheprovider

test:py3.9-prov2.0:
  extends: .test
  variables: {PYTHON: "3.9", PROV: "2.0.0"}

test:py3.12-prov2.2:
  extends: .test
  variables: {PYTHON: "3.12", PROV: "2.2.0"}

test:py3.12-prov3.2:
  extends: .test
  variables: {PYTHON: "3.12", PROV: "3.2.2"}

docs:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  variables:
    UV_CACHE_DIR: .uv-cache
  script:
    - uv run --extra docs sphinx-build -b html -W --keep-going docs docs/_build/html
  artifacts:
    paths:
      - docs/_build/html
    expire_in: 1 week

build:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Publish to PyPI when a version tag is pushed (v0.1.0, v1.2.3, ...), once the tests, the documentation
# and the build have passed. PyPI trusted publishing is not available for a self-hosted GitLab, so the upload
# uses an API token stored in the CI/CD variable UV_PUBLISH_TOKEN (see the README).
publish:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  dependencies:
    - build
  script:
    # the tag must be the version of the package, otherwise the wrong version would be published
    - test "v$(uv version --short)" = "$CI_COMMIT_TAG" || { echo "Tag $CI_COMMIT_TAG does not match version $(uv version --short) in pyproject.toml"; exit 1; }
    - uvx twine check dist/*
    # --check-url skips the files already on PyPI, so running the job again is harmless
    - uv publish --check-url https://pypi.org/simple/ dist/*
