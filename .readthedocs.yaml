# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Documentation sources: docs/ (Sphinx with MyST markdown pages and the notebooks of tutorials/)
sphinx:
  configuration: docs/conf.py

# Install voprov with the dependencies declared in pyproject.toml, plus the docs extra
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
